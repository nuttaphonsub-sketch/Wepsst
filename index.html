<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SST Transport - ระบบประเมินราคา</title>
    <style>
        /* --- ธีมบริษัท (Corporate Theme) --- */
        :root {
            --primary: #1565C0; /* สีน้ำเงินเข้ม */
            --dark: #263238;    /* สีเทาเข้ม */
            --bg: #F0F2F5;      /* สีพื้นหลังสบายตา */
            --white: #FFFFFF;
        }
        * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: var(--bg); margin: 0; padding: 10px; color: var(--dark); }
        .container { max-width: 600px; margin: auto; background: var(--white); border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); padding: 25px; }
        
        h1 { text-align: center; color: var(--primary); font-size: 24px; margin-top: 0; margin-bottom: 20px;}
        h2 { font-size: 16px; margin-bottom: 15px; border-bottom: 2px solid var(--primary); padding-bottom: 5px; display: inline-block; color: var(--dark); }
        
        .section { margin-bottom: 25px; }
        .form-group { position: relative; margin-bottom: 15px; }
        label { display: block; font-size: 14px; color: #555; margin-bottom: 6px; font-weight: bold; }
        
        /* สไตล์กล่องข้อความแบบอ่านอย่างเดียว (ล็อกพิกัด) */
        .input-locked { width: 100%; padding: 12px; background: #e9ecef; border: 1px solid #ccc; border-radius: 8px; font-size: 15px; color: #555; cursor: not-allowed; }
        
        /* สไตล์กล่องข้อความที่มีปุ่มกากบาทด้านใน */
        .input-wrapper { position: relative; display: flex; align-items: center; }
        .input-wrapper input { width: 100%; padding: 12px; padding-right: 40px; border: 1px solid #ccc; border-radius: 8px; font-size: 15px; transition: border 0.3s; }
        .input-wrapper input:focus { outline: none; border-color: var(--primary); }
        
        /* ปุ่มกากบาทลบข้อความ */
        .btn-clear {
            position: absolute;
            right: 10px;
            background: none;
            border: none;
            font-size: 16px;
            color: #999;
            cursor: pointer;
            display: none; /* ซ่อนไว้ก่อน จะแสดงเมื่อมีการพิมพ์ */
        }
        .btn-clear:hover { color: #E53935; }
        
        .autocomplete-list { position: absolute; top: 100%; left: 0; right: 0; background: #fff; border: 1px solid #ddd; z-index: 10; max-height: 200px; overflow-y: auto; border-radius: 0 0 8px 8px; display: none; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        .autocomplete-item { padding: 12px; border-bottom: 1px solid #eee; cursor: pointer; font-size: 14px; }
        .autocomplete-item:hover { background: #E3F2FD; color: var(--primary); }

        .checkbox-group { display: flex; align-items: center; margin-bottom: 12px; background: #F8F9FA; padding: 12px; border-radius: 8px; border: 1px solid #eee; }
        .checkbox-group input { width: 20px; height: 20px; margin-right: 12px; accent-color: var(--primary); cursor: pointer; }
        .checkbox-group label { margin: 0; font-size: 15px; font-weight: bold; color: var(--dark); cursor: pointer; }
        .price-tag { margin-left: auto; color: var(--primary); font-weight: bold; font-size: 15px; }

        .btn-main { width: 100%; background: var(--primary); color: #fff; border: none; padding: 16px; border-radius: 8px; font-size: 18px; font-weight: bold; cursor: pointer; margin-top: 10px; transition: background 0.3s; box-shadow: 0 4px 6px rgba(21, 101, 192, 0.2); }
        .btn-main:hover { background: #0D47A1; }
        .btn-main:disabled { background: #90CAF9; cursor: not-allowed; }
        
        .result-box { background: #E3F2FD; padding: 20px; border-radius: 12px; margin-top: 25px; text-align: center; display: none; border: 1px solid #BBDEFB; }
        .result-box h3 { margin: 5px 0 15px; font-size: 36px; color: var(--primary); }
        .result-box p { margin: 5px 0 0; color: #555; font-size: 16px; }

        .action-btns { display: flex; gap: 10px; margin-top: 15px; }
        .btn-action { flex: 1; background: var(--white); color: var(--primary); border: 2px solid var(--primary); padding: 12px; border-radius: 8px; font-weight: bold; cursor: pointer; transition: all 0.3s; font-size: 14px;}
        .btn-action:hover { background: var(--primary); color: var(--white); }

        /* Modal Preview */
        #modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); z-index: 100; overflow-y: auto; padding: 20px; }
        #modal-content { max-width: 800px; margin: auto; background: #fff; padding: 20px; border-radius: 12px; text-align: center; }
        canvas { max-width: 100%; height: auto; border: 1px solid #ccc; box-shadow: 0 0 10px rgba(0,0,0,0.2); }
        .btn-close { background: #E0E0E0; color: #333; border: none; padding: 12px 25px; border-radius: 8px; cursor: pointer; font-weight: bold; margin-top: 15px; font-size: 16px;}
        .btn-download { background: var(--primary); color: #fff; border: none; padding: 12px 25px; border-radius: 8px; cursor: pointer; font-weight: bold; margin-top: 15px; margin-left: 10px; font-size: 16px;}
    </style>
</head>
<body>

<div class="container">
    <h1>ทรัพย์สิน ขนส่ง (SST TRANSPORT)</h1>

    <div class="section">
        <h2>📍 เส้นทางขนส่ง (งานเหมา)</h2>
        <div class="form-group">
            <label>สถานที่ต้นทาง</label>
            <div class="input-locked">โมเม้นต์ เฟอร์นิเจอร์ (จุดโหลดสินค้า)</div>
        </div>
        
        <div class="form-group">
            <label>สถานที่ปลายทาง <span style="color: #E53935; font-size: 12px; font-weight: normal;">(ต้องกดเลือกจากรายการที่เด้งขึ้นมา)</span></label>
            <div class="input-wrapper">
                <input type="text" id="endInput" placeholder="พิมพ์ชื่อสถานที่ หรือ จังหวัด..." autocomplete="off">
                <button type="button" id="clearEndBtn" class="btn-clear" onclick="clearEndInput()">❌</button>
            </div>
            <div id="endList" class="autocomplete-list"></div>
        </div>
    </div>

    <div class="section">
        <h2>🚚 บริการเสริม</h2>
        <div class="checkbox-group">
            <input type="checkbox" id="chkPorter">
            <label for="chkPorter">เด็กยกเพิ่ม (1 คน)</label>
            <span class="price-tag">+500 ฿</span>
        </div>
        <div class="checkbox-group">
            <input type="checkbox" id="chkRush">
            <label for="chkRush">งานด่วนพิเศษ</label>
            <span class="price-tag">+1,500 ฿</span>
        </div>
    </div>

    <button id="btnCalc" class="btn-main" onclick="calculateAll()">💰 คำนวณราคาและระยะทาง</button>

    <div id="resultBox" class="result-box">
        <p>ระยะทาง: <strong id="resDist">0</strong> กม.</p>
        <p>ยอดรวมสุทธิ</p>
        <h3 id="resTotal">0 ฿</h3>
        
        <div class="action-btns">
            <button class="btn-action" onclick="showPreview('slip')">📄 สลิปสรุปภาพ</button>
            <button class="btn-action" onclick="showPreview('quotation')">📝 ใบเสนอราคา</button>
            <button class="btn-action" onclick="showPreview('receipt')">📦 ใบรับสินค้า</button>
        </div>
    </div>
</div>

<div id="modal">
    <div id="modal-content">
        <h3 id="modalTitle" style="margin-top:0; color: #1565C0;">พรีวิวเอกสาร</h3>
        <canvas id="previewCanvas"></canvas>
        <br>
        <button class="btn-close" onclick="closeModal()">❌ ปิด</button>
        <button class="btn-download" onclick="downloadImage()">💾 บันทึกรูปลงเครื่อง</button>
    </div>
</div>

<script>
    let appState = {
        startName: 'โมเม้นต์ เฟอร์นิเจอร์', 
        startLat: '13.814036', 
        startLon: '100.727448',
        
        endName: '', endLat: '', endLon: '',
        distance: 0,
        totalPrice: 0,
        currentDocType: ''
    };

    const companyInfo = {
        name: "ทรัพย์สิน ขนส่ง (SST TRANSPORT)",
        sub: "บริการรถตู้ทึบรับจ้าง ขนส่งสินค้า ทั่วไทย",
        contact: "โทร: 096-410-4396 | LINE: bdw2566"
    };

    let debounceTimer;
    const inputEnd = document.getElementById('endInput');
    const listEnd = document.getElementById('endList');
    const clearBtn = document.getElementById('clearEndBtn');

    // เมื่อมีการพิมพ์ข้อความ
    inputEnd.addEventListener('input', function() {
        // ถ้ายูสเซอร์แอบพิมพ์แก้ข้อความ ให้เคลียร์พิกัดเดิมทิ้ง (บังคับให้ต้องกดเลือกใหม่)
        appState.endLon = ''; 
        appState.endLat = '';
        appState.endName = '';
        
        // แสดงปุ่มกากบาทถ้ามีตัวหนังสือ
        clearBtn.style.display = this.value.length > 0 ? 'block' : 'none';

        clearTimeout(debounceTimer);
        listEnd.style.display = 'none';
        
        if(this.value.trim().length < 2) return;

        debounceTimer = setTimeout(async () => {
            try {
                const res = await fetch(`https://nominatim.openstreetmap.org/search?q=${this.value}&format=json&countrycodes=th&limit=5`);
                const data = await res.json();
                listEnd.innerHTML = '';
                if(data.length > 0) {
                    data.forEach(place => {
                        const div = document.createElement('div');
                        div.className = 'autocomplete-item';
                        div.innerText = place.display_name;
                        div.onclick = () => {
                            inputEnd.value = place.display_name;
                            appState.endName = place.display_name; 
                            appState.endLat = place.lat; 
                            appState.endLon = place.lon;
                            
                            listEnd.style.display = 'none';
                            clearBtn.style.display = 'block'; // ให้ปุ่มกากบาทยังอยู่
                        };
                        listEnd.appendChild(div);
                    });
                    listEnd.style.display = 'block';
                }
            } catch(e) { console.error(e); }
        }, 500);
    });

    // ฟังก์ชันสำหรับกดปุ่มกากบาท (เคลียร์ข้อความ)
    function clearEndInput() {
        inputEnd.value = '';
        appState.endName = '';
        appState.endLat = '';
        appState.endLon = '';
        
        clearBtn.style.display = 'none';
        listEnd.style.display = 'none';
        inputEnd.focus(); // ให้เคอร์เซอร์กลับไปกระพริบรอพิมพ์ใหม่
    }

    // ซ่อนลิสต์เมื่อคลิกที่อื่น
    document.addEventListener('click', (e) => { 
        if(e.target !== inputEnd && e.target !== listEnd) {
            listEnd.style.display = 'none'; 
        }
    });

    function roundUpToHundred(amount) {
        let intAmount = Math.floor(amount);
        let remainder = intAmount % 100;
        if (remainder === 0) return intAmount;
        if (remainder < 50) return intAmount - remainder;
        return intAmount + (100 - remainder);
    }

    async function calculateAll() {
        // เช็กก่อนเลยว่ามีพิกัดปลายทางไหม
        if(!appState.endLon) {
            if(inputEnd.value.trim() !== "") {
                alert("⚠️ คุณพิมพ์ปลายทางแล้ว แต่ยังไม่ได้ 'กดเลือก' จากรายการที่เด้งขึ้นมา\n\n(กรุณากดกากบาทแล้วพิมพ์ใหม่เพื่อเลือกจากรายการครับ)");
            } else {
                alert("⚠️ กรุณาพิมพ์และกดเลือก 'สถานที่ปลายทาง' จากรายการ");
            }
            return;
        }

        const btn = document.getElementById('btnCalc');
        btn.innerText = "⏳ กำลังคำนวณระยะทางและราคา...";
        btn.disabled = true;

        try {
            const url = `https://router.project-osrm.org/route/v1/driving/${appState.startLon},${appState.startLat};${appState.endLon},${appState.endLat}?overview=false`;
            const res = await fetch(url);
            const data = await res.json();
            
            if(data.routes && data.routes.length > 0) {
                appState.distance = parseFloat((data.routes[0].distance / 1000).toFixed(1));

                let basePrice = 1000 + (appState.distance * 15);
                
                if(document.getElementById('chkPorter').checked) basePrice += 500;
                if(document.getElementById('chkRush').checked) basePrice += 1500;

                appState.totalPrice = roundUpToHundred(basePrice);

                document.getElementById('resDist').innerText = appState.distance;
                document.getElementById('resTotal').innerText = appState.totalPrice.toLocaleString() + " ฿";
                document.getElementById('resultBox').style.display = 'block';
            } else {
                alert("❌ ระบบไม่สามารถคำนวณเส้นทางนี้ได้ กรุณาลองเลือกจุดหมายอื่น");
            }
        } catch(e) {
            alert("❌ เกิดข้อผิดพลาดในการเชื่อมต่อเครือข่าย");
        }

        btn.innerText = "💰 คำนวณราคาและระยะทาง";
        btn.disabled = false;
    }

    function getSmartLocation(fullAddress) {
        if (!fullAddress || fullAddress.length < 5) return fullAddress || "-";
        const parts = fullAddress.split(",").map(s => s.trim()).filter(s => s !== "");
        const reversed = parts.reverse();
        let district = "", province = "";
        for (let part of reversed) {
            if (part === "ประเทศไทย" || part.toLowerCase() === "thailand") continue;
            if (part.length === 5 && !isNaN(part)) continue; 
            if (!province) { province = part; continue; }
            if (!district) { district = part; break; }
        }
        if (district && province && district !== province) return `${district}, ${province}`;
        if (district) return district;
        return parts.slice(-2).join(", ");
    }

    function showPreview(type) {
        appState.currentDocType = type;
        const modal = document.getElementById('modal');
        const canvas = document.getElementById('previewCanvas');
        const ctx = canvas.getContext('2d');
        
        modal.style.display = 'block';

        if(type === 'slip') drawSlip(canvas, ctx);
        else drawA4(canvas, ctx, type);
    }

    function closeModal() { document.getElementById('modal').style.display = 'none'; }

    function downloadImage() {
        const canvas = document.getElementById('previewCanvas');
        const link = document.createElement('a');
        const docId = Date.now().toString().slice(-6);
        let prefix = appState.currentDocType === 'slip' ? 'Slip' : (appState.currentDocType === 'receipt' ? 'Receipt' : 'Quotation');
        link.download = `SST_${prefix}_${docId}.png`;
        link.href = canvas.toDataURL('image/png');
        link.click();
    }

    function wrapText(ctx, text, x, y, maxWidth, lineHeight) {
        if(!text) return y;
        let words = text.split(' ');
        let line = '';
        for(let n = 0; n < words.length; n++) {
            let testLine = line + words[n] + ' ';
            let metrics = ctx.measureText(testLine);
            if (metrics.width > maxWidth && n > 0) {
                ctx.fillText(line, x, y);
                line = words[n] + ' ';
                y += lineHeight;
            } else { line = testLine; }
        }
        ctx.fillText(line, x, y);
        return y + lineHeight;
    }

    // 1. วาดสลิปแบบยาว
    function drawSlip(canvas, ctx) {
        canvas.width = 800;
        canvas.height = 1100;
        
        ctx.fillStyle = "#FFFFFF";
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        
        ctx.fillStyle = "#1565C0";
        ctx.fillRect(0, 0, canvas.width, 220);

        ctx.fillStyle = "#FFFFFF";
        ctx.textAlign = "center";
        ctx.font = "bold 45px sans-serif";
        ctx.fillText(companyInfo.name, canvas.width/2, 100);
        ctx.font = "28px sans-serif";
        ctx.fillText(companyInfo.sub, canvas.width/2, 145);
        ctx.font = "24px sans-serif";
        ctx.fillText(companyInfo.contact, canvas.width/2, 185);

        let y = 290;
        let leftX = 60;
        let rightX = canvas.width - 60;

        function drawLine(label, value, isBold = false, isHighlight = false) {
            ctx.textAlign = "left";
            ctx.fillStyle = "#555555";
            ctx.font = "28px sans-serif";
            ctx.fillText(label, leftX, y);

            ctx.textAlign = "right";
            ctx.fillStyle = isHighlight ? "#1565C0" : "#212121";
            ctx.font = isBold ? "bold 30px sans-serif" : "28px sans-serif";
            ctx.fillText(value, rightX, y);
            y += 55;
        }

        let today = new Date();
        let dateStr = today.toLocaleDateString('th-TH') + " " + today.toLocaleTimeString('th-TH', {hour: '2-digit', minute:'2-digit'});

        drawLine("วันที่ออกยอด", dateStr);
        y += 20; ctx.strokeStyle = "#E0E0E0"; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(leftX, y); ctx.lineTo(rightX, y); ctx.stroke(); y += 50;
        
        drawLine("ประเภทบริการ", "งานเหมา 🚚", true);
        drawLine("ต้นทาง", appState.startName);
        drawLine("ปลายทาง", getSmartLocation(appState.endName));
        drawLine("ระยะทางประเมิน", appState.distance + " กม.");
        
        if(document.getElementById('chkPorter').checked) drawLine("+ เด็กยกเพิ่ม", "500", false, true);
        if(document.getElementById('chkRush').checked) drawLine("+ งานด่วนพิเศษ", "1,500", false, true);

        y += 40;
        ctx.fillStyle = "#E3F2FD";
        ctx.fillRect(40, y, canvas.width - 80, 180);
        ctx.strokeStyle = "#90CAF9";
        ctx.strokeRect(40, y, canvas.width - 80, 180);

        y += 110;
        ctx.textAlign = "left";
        ctx.fillStyle = "#1565C0";
        ctx.font = "bold 40px sans-serif";
        ctx.fillText("ยอดรวมสุทธิ", leftX + 30, y);

        ctx.textAlign = "right";
        ctx.font = "bold 45px sans-serif";
        ctx.fillText(appState.totalPrice.toLocaleString() + " ฿", rightX - 30, y);

        y += 140;
        ctx.textAlign = "center";
        ctx.fillStyle = "#888";
        ctx.font = "24px sans-serif";
        ctx.fillText("ขอบคุณที่ใช้บริการ " + companyInfo.name, canvas.width/2, y);
    }

    // 2. วาดใบเสนอราคา / ใบรับสินค้า (A4 Format)
    function drawA4(canvas, ctx, type) {
        canvas.width = 1240;
        canvas.height = 1754;
        
        ctx.fillStyle = "#FFFFFF";
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        ctx.fillStyle = "#1565C0";
        ctx.font = "bold 40px sans-serif"; 
        ctx.textAlign = "left";
        ctx.fillText(companyInfo.name, 80, 150);
        
        ctx.fillStyle = "#263238";
        ctx.font = "26px sans-serif";
        ctx.fillText(companyInfo.sub, 80, 200);
        ctx.fillText(companyInfo.contact, 80, 240);

        let isReceipt = type === 'receipt';
        let docTitle = isReceipt ? "ใบรับสินค้า (RECEIPT)" : "ใบเสนอราคา (QUOTATION)";
        let docId = (isReceipt ? "GR-" : "QT-") + Date.now().toString().slice(-6);
        let dateStr = new Date().toLocaleDateString('th-TH');

        ctx.textAlign = "right";
        ctx.fillStyle = "#1565C0";
        ctx.font = "bold 40px sans-serif";
        ctx.fillText(docTitle, 1160, 150);
        
        ctx.fillStyle = "#555";
        ctx.font = "26px sans-serif";
        ctx.fillText(`เลขที่เอกสาร: ${docId}`, 1160, 200);
        ctx.fillText(`วันที่: ${dateStr}`, 1160, 240);

        ctx.strokeStyle = "#1565C0";
        ctx.lineWidth = 3;
        ctx.beginPath(); ctx.moveTo(80, 280); ctx.lineTo(1160, 280); ctx.stroke();

        ctx.textAlign = "left";
        ctx.fillStyle = "#263238";
        ctx.font = "bold 28px sans-serif";
        ctx.fillText(`จุดโหลดสินค้า (ต้นทาง) : ${appState.startName}`, 80, 350);
        ctx.fillText(`จุดส่งสินค้า (ปลายทาง) : ${appState.endName || "-"}`, 80, 410);

        let ty = 480;
        ctx.fillStyle = "#F8F9FA";
        ctx.fillRect(80, ty, 1080, 70);
        ctx.strokeStyle = "#CFD8DC";
        ctx.lineWidth = 2;
        ctx.strokeRect(80, ty, 1080, 70);

        ctx.fillStyle = "#263238";
        ctx.font = "bold 26px sans-serif";
        ctx.fillText("ลำดับ", 110, ty + 45);
        ctx.fillText("รายการ / รายละเอียด", 250, ty + 45);
        ctx.fillText("จำนวน", 850, ty + 45);
        ctx.textAlign = "right";
        ctx.fillText("จำนวนเงิน (บาท)", 1130, ty + 45);

        ty += 70;
        ctx.textAlign = "left";
        ctx.font = "26px sans-serif";
        
        ctx.fillText("1", 120, ty + 50);
        
        let details = `งานบริการขนส่งสินค้า (เหมาคัน)\n`;
        details += `ระยะทางประเมิน: ${appState.distance} กม.\n`;
        
        let optText = [];
        if(document.getElementById('chkPorter').checked) optText.push("เด็กยกเพิ่ม (+500)");
        if(document.getElementById('chkRush').checked) optText.push("งานด่วน (+1500)");
        if(optText.length > 0) details += `บริการเสริม: ${optText.join(', ')}\n`;

        let nextY = wrapText(ctx, details, 250, ty + 50, 550, 40);
        
        ctx.textAlign = "left";
        ctx.fillText("1 งาน", 840, ty + 50);
        
        ctx.textAlign = "right";
        ctx.fillText(appState.totalPrice.toLocaleString(), 1130, ty + 50);

        let rowBottom = Math.max(nextY + 40, ty + 180);
        ctx.strokeRect(80, ty, 1080, rowBottom - ty);
        
        ctx.beginPath();
        ctx.moveTo(220, 480); ctx.lineTo(220, rowBottom);
        ctx.moveTo(820, 480); ctx.lineTo(820, rowBottom);
        ctx.moveTo(980, 480); ctx.lineTo(980, rowBottom);
        ctx.stroke();

        ty = rowBottom;
        ctx.fillStyle = "#E3F2FD";
        ctx.fillRect(820, ty, 340, 80);
        ctx.strokeRect(820, ty, 340, 80);

        ctx.fillStyle = "#1565C0";
        ctx.font = "bold 30px sans-serif";
        ctx.textAlign = "left";
        ctx.fillText("ยอดรวมสุทธิ", 840, ty + 52);
        ctx.textAlign = "right";
        ctx.fillText(appState.totalPrice.toLocaleString(), 1130, ty + 52);

        let signY = 1500;
        ctx.strokeStyle = "#90A4AE";
        ctx.lineWidth = 1;
        
        if (isReceipt) {
            ctx.beginPath(); ctx.moveTo(200, signY); ctx.lineTo(500, signY); ctx.stroke();
            ctx.textAlign = "center";
            ctx.fillStyle = "#263238";
            ctx.fillText("( ผู้ส่งมอบสินค้า / พนักงานขับรถ )", 350, signY + 40);
            ctx.fillText("วันที่: ______/______/______", 350, signY + 80);

            ctx.beginPath(); ctx.moveTo(740, signY); ctx.lineTo(1040, signY); ctx.stroke();
            ctx.fillText("( ผู้รับสินค้า )", 890, signY + 40);
            ctx.fillText("วันที่: ______/______/______", 890, signY + 80);
        } else {
            ctx.beginPath(); ctx.moveTo(740, signY); ctx.lineTo(1040, signY); ctx.stroke();
            ctx.textAlign = "center";
            ctx.fillStyle = "#263238";
            ctx.fillText(`( ${companyInfo.name} )`, 890, signY + 40);
            ctx.fillText("ผู้ออกเอกสาร", 890, signY + 80);
        }
    }
</script>
